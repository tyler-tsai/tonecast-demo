name: Tonecast
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: XXXXXXXXXX    # set to your 10-char Apple Developer Team ID
    ENABLE_BITCODE: NO

targets:

  Tonecast:
    type: application
    platform: iOS
    sources:
      - path: Tonecast
      - path: Shared
      - path: TonecastKeyboard/Secrets.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tonecast
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Tonecast/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Tonecast/Tonecast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: TonecastKeyboard
        embed: true
        codeSign: true

  TonecastKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: TonecastKeyboard
        excludes:
          - "Secrets.swift"
      - path: Shared
      - path: Tonecast/Tone.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tonecast.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: TonecastKeyboard/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: TonecastKeyboard/TonecastKeyboard.entitlements
